<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Group Priority Ranker - Google Sheets</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: system-ui, 'Segoe UI', monospace;
            background: #f5f3f0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1300px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2rem;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .sub {
            color: #555;
            margin-top: 5px;
        }
        .rank-status {
            background: #e9e6e2;
            padding: 8px 16px;
            border-radius: 60px;
            display: inline-block;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .matchup-area {
            background: white;
            border-radius: 48px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
            padding: 20px 15px 30px 15px;
            margin-bottom: 30px;
        }
        .vs-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }
        .card {
            flex: 1;
            min-width: 240px;
            background: #fefcf9;
            border-radius: 36px;
            padding: 28px 12px 28px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid #e2ddd6;
            box-shadow: 0 6px 0 #ddd8d0;
        }
        .card:hover {
            transform: translateY(-4px);
            background: #fffaf2;
            border-color: #cbc3b8;
        }
        .card:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ddd8d0;
        }
        .item-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 15px 0 8px;
            word-break: break-word;
        }
        .vs-badge {
            font-size: 2rem;
            font-weight: 800;
            background: #2c2a27;
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }
        .button-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }
        button {
            background: #1e1b18;
            border: none;
            color: white;
            font-size: 1rem;
            padding: 10px 24px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.1s linear;
        }
        button:active { transform: scale(0.97); }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .results-section {
            background: #fff;
            border-radius: 36px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        .rank-list {
            list-style: none;
            padding: 0;
        }
        .rank-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid #ece7e1;
            font-size: 1.2rem;
        }
        .rank-number {
            font-weight: bold;
            background: #e6e0d8;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 34px;
        }
        .score-badge {
            margin-left: auto;
            font-family: monospace;
            background: #f0ede8;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 0.8rem;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-style: italic;
        }
        .error {
            text-align: center;
            padding: 40px;
            color: #d32f2f;
            background: #ffebee;
            border-radius: 24px;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.75rem;
            color: #777;
        }
        .vote-counter {
            font-size: 0.9rem;
            margin-top: 15px;
            text-align: center;
            color: #666;
        }
        .config-warning {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 12px 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            font-size: 0.9rem;
        }
        @media (max-width: 700px) {
            .item-name { font-size: 1.3rem; }
            .card { padding: 18px 8px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 Group Priority Ranker</h1>
        <div class="sub">Click the item that matters MORE to the group</div>
        <div class="rank-status" id="statusDisplay">Connecting to Google Sheets...</div>
    </div>

    <div class="matchup-area" id="matchupArea">
        <div class="vs-container" id="vsContainer">
            <div class="loading">Loading items from Google Sheets...</div>
        </div>
        <div class="button-bar">
            <button id="resultsBtn" disabled>📈 View Ranking & Results</button>
        </div>
        <div class="vote-counter" id="voteCounter"></div>
    </div>

    <div class="results-section" id="resultsPanel" style="display: none;">
        <h3>🏆 Current Group Priority Ranking</h3>
        <div id="resultsList" class="rank-list">Loading ranking...</div>
        <div style="margin-top: 20px; text-align: right;">
            <button id="closeResults">← Back to voting</button>
        </div>
    </div>
    <footer>Every vote saves to Google Sheets. Higher score = higher priority to the group.</footer>
</div>

<script>
    // ========== CONFIGURATION ==========
    // REPLACE THIS URL WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygtRKNugzWk7F5M28Uy-6xZKyA5vuAK901o2ZnJaReXGrV1BGLeP9CWAdAavBWi36g/exec";
    // ====================================
    
    // GLOBALS
    let allItems = [];
    let currentPair = { a: null, b: null };
    let sessionId = localStorage.getItem("ranker_session");
    let totalVotes = 0;
    let isLoading = true;
    
    if (!sessionId) {
        sessionId = "sess_" + Date.now() + "_" + Math.random().toString(36).substr(2, 8);
        localStorage.setItem("ranker_session", sessionId);
    }
    
    // Elo constants
    const K_FACTOR = 32;
    const DEFAULT_ELO = 1500;
    
    // Helper: Update status display
    function updateStatus(message, isError = false) {
        const statusDiv = document.getElementById("statusDisplay");
        if (statusDiv) {
            statusDiv.innerHTML = message;
            statusDiv.style.background = isError ? "#ffebee" : "#e9e6e2";
            statusDiv.style.color = isError ? "#c62828" : "inherit";
        }
    }
    
    // Load items from Google Sheets
    async function fetchItemsFromSheets() {
        if (!SCRIPT_URL || SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
            updateStatus("⚠️ Please configure SCRIPT_URL in the code", true);
            document.getElementById("vsContainer").innerHTML = `
                <div class="error">
                    <strong>Configuration Error</strong><br><br>
                    Please set your Google Apps Script URL in the <code>SCRIPT_URL</code> variable.<br><br>
                    <small>Line ~100 in the HTML file</small>
                </div>
            `;
            return false;
        }
        
        try {
            updateStatus("📡 Fetching items from Google Sheets...");
            const url = `${SCRIPT_URL}?action=getItems&t=${Date.now()}`;
            const resp = await fetch(url);
            
            if (!resp.ok) {
                throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
            }
            
            const items = await resp.json();
            
            // Check for error response
            if (items.error) {
                throw new Error(items.error);
            }
            
            if (!items || items.length === 0) {
                throw new Error("No items found in the 'Items' sheet");
            }
            
            if (items.length < 2) {
                throw new Error("Need at least 2 items to rank. Add more rows to your 'Items' sheet.");
            }
            
            // Load stored Elo ratings from localStorage
            let storedRatings = {};
            try {
                storedRatings = JSON.parse(localStorage.getItem("item_elos") || "{}");
            } catch(e) {}
            
            allItems = items.map(it => ({
                id: String(it.id),
                name: it.name,
                elo: storedRatings[it.id] || DEFAULT_ELO
            }));
            
            updateStatus(`✓ Loaded ${allItems.length} items from Google Sheets`);
            return true;
            
        } catch (err) {
            console.error("Fetch error:", err);
            updateStatus(`❌ Error: ${err.message}`, true);
            document.getElementById("vsContainer").innerHTML = `
                <div class="error">
                    <strong>Failed to load from Google Sheets</strong><br><br>
                    ${escapeHtml(err.message)}<br><br>
                    <small>Check:<br>
                    1. Apps Script is deployed as Web App<br>
                    2. Execute as "Me", Access "Anyone"<br>
                    3. SCRIPT_URL is correct<br>
                    4. Sheet named "Items" exists with columns: id, name</small>
                </div>
            `;
            return false;
        }
    }
    
    // Save vote to Google Sheets
    async function saveVoteToSheets(winnerId, loserId) {
        if (!SCRIPT_URL || SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
            console.warn("No SCRIPT_URL configured, vote not saved");
            return false;
        }
        
        try {
            const params = new URLSearchParams();
            params.append("action", "saveVote");
            params.append("winnerId", winnerId);
            params.append("loserId", loserId);
            params.append("sessionId", sessionId);
            
            const response = await fetch(`${SCRIPT_URL}?${params.toString()}`);
            const result = await response.json();
            
            if (result.status === "success") {
                return true;
            } else {
                console.warn("Sheet save returned error:", result.error);
                return false;
            }
        } catch (err) {
            console.warn("Could not save vote to Google Sheets:", err);
            return false;
        }
    }
    
    // Persist Elo to localStorage
    function persistElos() {
        let obj = {};
        allItems.forEach(it => { obj[it.id] = it.elo; });
        localStorage.setItem("item_elos", JSON.stringify(obj));
    }
    
    // Get random pair of items
    function getRandomPair() {
        if (!allItems || allItems.length < 2) return null;
        
        let idxA = Math.floor(Math.random() * allItems.length);
        let idxB = Math.floor(Math.random() * allItems.length);
        while (idxA === idxB && allItems.length > 1) {
            idxB = Math.floor(Math.random() * allItems.length);
        }
        
        return { a: allItems[idxA], b: allItems[idxB] };
    }
    
    // Render the two cards
    function renderMatchup() {
        const container = document.getElementById("vsContainer");
        if (!currentPair.a || !currentPair.b) {
            container.innerHTML = "<div class='loading'>Not enough items to compare</div>";
            return;
        }
        
        container.innerHTML = `
            <div class="card" data-choice="${currentPair.a.id}">
                <div style="font-size: 2rem;">🔹</div>
                <div class="item-name">${escapeHtml(currentPair.a.name)}</div>
                <div style="font-size:0.8rem; margin-top:12px; color:#2c7a4d;">← MORE IMPORTANT</div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="card" data-choice="${currentPair.b.id}">
                <div style="font-size: 2rem;">🔸</div>
                <div class="item-name">${escapeHtml(currentPair.b.name)}</div>
                <div style="font-size:0.8rem; margin-top:12px; color:#2c7a4d;">MORE IMPORTANT →</div>
            </div>
        `;
    }
    
    // Record a vote and update Elo ratings
    async function recordVote(winnerId) {
        if (isLoading) {
            console.log("Still loading, please wait");
            return;
        }
        
        const winner = allItems.find(i => i.id === winnerId);
        const loser = (currentPair.a.id === winnerId) ? currentPair.b : currentPair.a;
        
        if (!winner || !loser) {
            console.error("Could not find winner or loser");
            return;
        }
        
        // Calculate Elo changes
        const expectedWinner = 1 / (1 + Math.pow(10, (loser.elo - winner.elo) / 400));
        const expectedLoser = 1 / (1 + Math.pow(10, (winner.elo - loser.elo) / 400));
        
        winner.elo = winner.elo + K_FACTOR * (1 - expectedWinner);
        loser.elo = loser.elo + K_FACTOR * (0 - expectedLoser);
        
        persistElos();
        totalVotes++;
        
        // Update vote counter display
        const voteCounter = document.getElementById("voteCounter");
        if (voteCounter) {
            voteCounter.innerHTML = `📊 ${totalVotes} vote${totalVotes !== 1 ? 's' : ''} recorded locally`;
        }
        
        // Save to Google Sheets (don't await - fire and forget for speed)
        saveVoteToSheets(winner.id, loser.id).then(success => {
            if (success && voteCounter) {
                voteCounter.innerHTML = `📊 ${totalVotes} vote${totalVotes !== 1 ? 's' : ''} saved to sheet`;
                setTimeout(() => {
                    if (voteCounter) voteCounter.innerHTML = `📊 ${totalVotes} vote${totalVotes !== 1 ? 's' : ''} recorded`;
                }, 2000);
            }
        });
        
        // Get next pair
        currentPair = getRandomPair();
        renderMatchup();
        updateRankingDisplay();
    }
    
    // Update the ranking view
    function updateRankingDisplay() {
        const sorted = [...allItems].sort((a,b) => b.elo - a.elo);
        const listDiv = document.getElementById("resultsList");
        if (!listDiv) return;
        
        listDiv.innerHTML = sorted.map((item, idx) => `
            <li>
                <span class="rank-number">${idx+1}</span>
                <strong>${escapeHtml(item.name)}</strong>
                <span class="score-badge">score ${Math.round(item.elo)}</span>
            </li>
        `).join('');
    }
    
    // Show results panel
    function showResults() {
        updateRankingDisplay();
        document.getElementById("matchupArea").style.display = "none";
        document.getElementById("resultsPanel").style.display = "block";
    }
    
    // Hide results panel
    function hideResults() {
        document.getElementById("matchupArea").style.display = "block";
        document.getElementById("resultsPanel").style.display = "none";
        if (currentPair) {
            renderMatchup();
        }
    }
    
    // Escape HTML
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Initialize the app
    async function init() {
        console.log("Initializing Google Sheets ranker...");
        
        // Load items from Sheets
        const success = await fetchItemsFromSheets();
        
        if (!success || allItems.length < 2) {
            isLoading = false;
            return;
        }
        
        isLoading = false;
        
        // Get first random pair
        currentPair = getRandomPair();
        renderMatchup();
        
        // Enable the results button
        const resultsBtn = document.getElementById("resultsBtn");
        if (resultsBtn) {
            resultsBtn.disabled = false;
        }
        
        // Set up event delegation for clicks on cards
        const container = document.getElementById("vsContainer");
        container.addEventListener('click', function(e) {
            const card = e.target.closest('.card');
            if (card && card.dataset.choice && !isLoading) {
                const chosenId = card.dataset.choice;
                recordVote(chosenId);
            }
        });
        
        // Set up button listeners
        document.getElementById("resultsBtn").addEventListener("click", showResults);
        document.getElementById("closeResults").addEventListener("click", hideResults);
        
        // Load previous vote count from localStorage
        const savedVotes = localStorage.getItem("total_votes_gs");
        if (savedVotes) totalVotes = parseInt(savedVotes);
        
        console.log("Initialization complete!");
    }
    
    // Save vote count periodically
    setInterval(() => {
        if (totalVotes > 0) {
            localStorage.setItem("total_votes_gs", totalVotes);
        }
    }, 5000);
    
    // Start the app
    init();
</script>
</body>
</html>
