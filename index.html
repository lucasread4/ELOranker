<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ATL UTD KIT RANKER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

        :root {
--ink:    #FFFFFF;        /* White text on dark */
--ink2:   #FEBE10;
--ink3:   #FEBE10;
--paper:  #0a0a0a;        /* Near-black background */
--card:   #111111;        /* Dark card */
--border: #9E2A2F;        /* Red border accent */
--accent: #9E2A2F;        /* Atlanta United Red */
--accent2:#FEBE10;        /* Atlanta United Gold */
--gold:   #FEBE10;
--radius: 16px;
--shadow: 0 2px 0 #9E2A2F;
        }

        body {
            font-family: 'Oswald', sans-serif;
            background: var(--paper);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 12px 40px;
            color: var(--ink);
        }

        /* ── Header (compacted for mobile) ── */
        .header {
            text-align: center;
            margin-bottom: 20px;
            animation: fadeUp 0.5s ease both;
        }
        .eyebrow {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
        }
        h1 {
            font-family: 'Oswald', serif;
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            font-weight: 500;
            line-height: 1.2;
            letter-spacing: -0.3px;
            color: var(--ink);
        }
        h1 em { font-style: italic; color: var(--accent); }
        .sub {
            font-size: 0.75rem;
            color: var(--ink2);
            margin-top: 6px;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--ink2);
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 60px;
            margin-top: 10px;
        }
        .pill-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }
        .pill-dot.offline { background: var(--gold); }
        .pill-dot.ok      { background: #5cad6b; }

        /* ── Main panel (reduced padding) ── */
        .panel {
            width: 100%;
            max-width: 780px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px 16px 20px;
            margin-bottom: 12px;
            animation: fadeUp 0.5s 0.08s ease both;
        }

        /* ── VS layout — MOBILE FIRST (horizontal row on all screens) ── */
        .vs-row {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 8px;
        }
        .choice-card {
            flex: 1;
            background: var(--paper);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 10px 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            position: relative;
            box-shadow: var(--shadow);
        }
        .choice-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            background: #1a1a1a;
            box-shadow: 0 6px 16px rgba(158,42,47,0.2);
        }
        .choice-card:active {
            transform: translateY(1px) scale(0.98);
        }
        .choice-card.voted-winner {
            border-color: #5cad6b;
            background: #1a2a1a;
            animation: winPulse 0.3s ease;
        }
        .choice-card.voted-loser {
            opacity: 0.4;
            transform: scale(0.97);
        }
        @keyframes winPulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* MOBILE OPTIMIZED: Smaller vertical rectangle images */
        .card-img {
            width: 100%;
            aspect-ratio: 2 / 3;  /* Taller for better mobile fit */
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 8px;
            background: var(--border);
            display: block;
        }
        .card-rank-hint {
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink3);
            margin-bottom: 6px;
        }
        .card-name {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.85rem, 3.5vw, 1.2rem);
            font-weight: 500;
            line-height: 1.2;
            word-break: break-word;
            color: var(--ink);
            margin: 3px 0 6px;
        }

        /* VS divider — smaller on mobile */
        .vs-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            width: auto;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .vs-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--gold);
            color: #000;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* ── Action bar (more compact) ── */
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .btn {
            border: 1.5px solid var(--border);
            background: var(--card);
            color: var(--ink);
            font-family: 'Oswald', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.12s, border-color 0.12s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn:hover  { background: var(--accent2); border-color: var(--accent); color: #000; }
        .btn:active { transform: scale(0.97); }
        .btn.primary { background: var(--gold); color: #000; border-color: var(--gold); }
        .btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* ── Results panel (mobile optimized) ── */
        #resultsPanel { display: none; }
        .results-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .rank-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .rank-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--paper);
            transition: background 0.15s;
        }
        .rank-item:first-child { background: #1a1a0a; border-color: var(--gold); }
        .rank-num {
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--ink3);
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }
        .rank-item:first-child .rank-num { color: var(--gold); }
        .rank-name {
            font-size: 0.85rem;
            font-weight: 500;
            flex: 1;
        }
        .rank-bar-wrap {
            width: 60px;
            height: 3px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .rank-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.6s ease;
        }
        .rank-item:first-child .rank-bar { background: var(--gold); }
        .rank-elo {
            font-family: 'Oswald', monospace;
            font-size: 0.7rem;
            color: var(--ink3);
            width: 38px;
            text-align: right;
            flex-shrink: 0;
        }

        /* Rank thumbnails for results (small vertical) */
        .rank-thumb {
            width: 28px;
            height: 42px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            background: var(--border);
        }

        /* ── Loading / error ── */
        .loading-state {
            text-align: center;
            padding: 30px 16px;
            color: var(--ink2);
        }
        .spinner {
            width: 24px; height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Footer ── */
        footer {
            font-size: 0.6rem;
            color: var(--ink3);
            text-align: center;
            margin-top: 8px;
            animation: fadeUp 0.5s 0.2s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── EXTRA SMALL PHONES (under 450px) ── */
        @media (max-width: 480px) {
            body {
                padding: 12px 10px 30px;
            }
            .panel {
                padding: 14px 12px 16px;
            }
            .choice-card {
                padding: 10px 8px 10px;
            }
            .vs-row {
                gap: 6px;
            }
            .vs-circle {
                width: 28px;
                height: 28px;
                font-size: 0.55rem;
            }
            .card-img {
                aspect-ratio: 2 / 3;
            }
            .card-name {
                font-size: 0.75rem;
            }
            .card-rank-hint {
                font-size: 0.5rem;
            }
        }

        /* ── Make sure horizontal row stays on all devices ── */
        @media (max-width: 560px) {
            /* Override any column behavior — keep horizontal */
            .vs-row {
                flex-direction: row !important;
            }
            .vs-divider {
                width: auto !important;
                height: auto !important;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="eyebrow">5-Stripes, 2 options</div>
    <h1>ATL UTD <em>Kit Ranker</em></h1>
    <div class="sub">Pick the kit that you like more</div>
    <div class="pill" id="statusPill">
        <span class="pill-dot" id="statusDot"></span>
        <span id="statusText">Loading…</span>
    </div>
</div>

<!-- Voting panel -->
<div class="panel" id="votingPanel">
    <div class="vs-row" id="vsContainer">
        <div class="loading-state">
            <div class="spinner"></div>
            Loading kits from the cloud…
        </div>
    </div>
    <div class="action-bar">
        <button class="btn primary" id="resultsBtn">View ranking</button>
    </div>
</div>

<!-- Results panel -->
<div class="panel" id="resultsPanel">
    <div class="results-title">
        🏆 Current Leaderboard
    </div>
    <ul class="rank-list" id="rankList"></ul>
    <div class="action-bar">
        <button class="btn" id="backBtn">← Back to voting</button>
    </div>
</div>

<footer>Every vote updates the ranking — more votes = more accurate results.</footer>

<script>
// ─────────────────────────────────────────────
//  CONFIG — paste your Apps Script URL here
// ─────────────────────────────────────────────
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwFsAwOlDCXpesp3vlr056p_5u8kAJGh_KoPl4Opz0amBo1x9o8OyVk7GrRz9h-a77Y/exec";
// ─────────────────────────────────────────────
//  Elo settings
// ─────────────────────────────────────────────
const K_FACTOR     = 32;
const DEFAULT_ELO  = 1500;

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let allItems   = [];
let currentPair = { a: null, b: null };
let totalVotes  = 0;
let locked      = false;

// Session ID
let sessionId = localStorage.getItem("ranker_session");
if (!sessionId) {
    sessionId = "sess_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("ranker_session", sessionId);
}

// ─────────────────────────────────────────────
//  Helper functions
// ─────────────────────────────────────────────
function esc(str) {
    return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;',
        '"': '&quot;', "'": '&#39;'
    })[c]);
}

function setStatus(text, state) {
    document.getElementById("statusText").textContent = text;
    const dot = document.getElementById("statusDot");
    dot.className = "pill-dot" + (state ? " " + state : "");
}

function persistElos() {
    const obj = {};
    allItems.forEach(it => { obj[String(it.id)] = it.elo; });
    localStorage.setItem("item_elos", JSON.stringify(obj));
}

function loadStoredElos() {
    try { return JSON.parse(localStorage.getItem("item_elos") || "{}"); }
    catch { return {}; }
}

function jsonp(url) {
    return new Promise((resolve, reject) => {
        const cbName = "_cb_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
        const script = document.createElement("script");
        const timer  = setTimeout(() => {
            cleanup();
            reject(new Error("Request timed out"));
        }, 10000);

        window[cbName] = data => { cleanup(); resolve(data); };

        function cleanup() {
            clearTimeout(timer);
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
        }

        script.onerror = () => { cleanup(); reject(new Error("Script load failed")); };
        script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cbName;
        document.head.appendChild(script);
    });
}

// ─────────────────────────────────────────────
//  Fetch items from Google Sheets
// ─────────────────────────────────────────────
async function fetchItems() {
    try {
        const items = await jsonp(`${SCRIPT_URL}?action=getItems`);
        
        if (items.error) throw new Error(items.error);
        if (!Array.isArray(items) || items.length < 2)
            throw new Error("Need at least 2 items in the Items sheet.");
        
        const stored = loadStoredElos();
        allItems = items.map(it => ({
            id:       String(it.id),
            name:     String(it.name),
            imageURL: String(it.imageURL || ""),
            elo:      stored[String(it.id)] ?? DEFAULT_ELO
        }));
        
        return true;
    } catch (err) {
        console.error(err);
        document.getElementById("vsContainer").innerHTML = `
            <div class="loading-state">
                <div style="font-size:1.4rem; margin-bottom:10px;">⚠️</div>
                <strong>${esc(err.message)}</strong>
                <div style="margin-top:10px; font-size:0.7rem; line-height:1.5; color:#9a9087;">
                    1. Deploy Apps Script as a Web App<br>
                    2. Execute as <em>Me</em>, access <em>Anyone</em><br>
                    3. Paste the correct URL into SCRIPT_URL
                </div>
            </div>`;
        setStatus("Connection error", "");
        return false;
    }
}

// ─────────────────────────────────────────────
//  Pick a random pair
// ─────────────────────────────────────────────
function getRandomPair() {
    if (allItems.length < 2) return null;
    const idxA = Math.floor(Math.random() * allItems.length);
    let   idxB = Math.floor(Math.random() * (allItems.length - 1));
    if (idxB >= idxA) idxB++;
    return { a: allItems[idxA], b: allItems[idxB] };
}

// ─────────────────────────────────────────────
//  Render the current pair
// ─────────────────────────────────────────────
function renderMatchup() {
    const c = document.getElementById("vsContainer");
    if (!currentPair?.a || !currentPair?.b) {
        c.innerHTML = "<div class='loading-state'>Preparing matchup…</div>";
        return;
    }
    const { a, b } = currentPair;
    const imgA = a.imageURL ? `<img class="card-img" src="${esc(a.imageURL)}" alt="${esc(a.name)}" draggable="false" loading="lazy">` : `<div class="card-img" style="background: var(--border); display: flex; align-items: center; justify-content: center; color: var(--ink3); font-size: 0.7rem;">No image</div>`;
    const imgB = b.imageURL ? `<img class="card-img" src="${esc(b.imageURL)}" alt="${esc(b.name)}" draggable="false" loading="lazy">` : `<div class="card-img" style="background: var(--border); display: flex; align-items: center; justify-content: center; color: var(--ink3); font-size: 0.7rem;">No image</div>`;
    c.innerHTML = `
        <div class="choice-card" data-choice="${esc(a.id)}">
            ${imgA}
            <div class="card-rank-hint">Option A</div>
            <div class="card-name">${esc(a.name)}</div>
        </div>
        <div class="vs-divider"><div class="vs-circle">VS</div></div>
        <div class="choice-card" data-choice="${esc(b.id)}">
            ${imgB}
            <div class="card-rank-hint">Option B</div>
            <div class="card-name">${esc(b.name)}</div>
        </div>`;
}

// ─────────────────────────────────────────────
//  Update ranking display
// ─────────────────────────────────────────────
function updateRankingDisplay() {
    const sorted   = [...allItems].sort((a, b) => b.elo - a.elo);
    const maxElo   = sorted[0]?.elo ?? DEFAULT_ELO;
    const minElo   = sorted[sorted.length - 1]?.elo ?? DEFAULT_ELO;
    const eloRange = maxElo - minElo || 1;

    const list = document.getElementById("rankList");
    list.innerHTML = sorted.map((item, i) => {
        const pct = Math.round(((item.elo - minElo) / eloRange) * 100);
        const thumb = item.imageURL ? `<img class="rank-thumb" src="${esc(item.imageURL)}" alt="">` : `<div class="rank-thumb" style="background: var(--border);"></div>`;
        return `
            <li class="rank-item">
                <span class="rank-num">${i + 1}</span>
                ${thumb}
                <span class="rank-name">${esc(item.name)}</span>
                <div class="rank-bar-wrap">
                    <div class="rank-bar" style="width:${pct}%"></div>
                </div>
                <span class="rank-elo">${Math.round(item.elo)}</span>
            </li>`;
    }).join("");
}

// ─────────────────────────────────────────────
//  Record a vote
// ─────────────────────────────────────────────
async function recordVote(winnerId) {
    if (locked) return;
    locked = true;

    const winner = allItems.find(i => i.id === winnerId);
    const loser  = currentPair.a.id === winnerId ? currentPair.b : currentPair.a;
    if (!winner || !loser) { locked = false; return; }

    // Optimistic Elo update
    const expWin  = 1 / (1 + Math.pow(10, (loser.elo - winner.elo) / 400));
    const expLose = 1 / (1 + Math.pow(10, (winner.elo - loser.elo) / 400));
    winner.elo += K_FACTOR * (1 - expWin);
    loser.elo  += K_FACTOR * (0 - expLose);
    persistElos();
    totalVotes++;

    // Animate
    const cards = document.querySelectorAll(".choice-card");
    cards.forEach(card => {
        if (card.dataset.choice === winnerId) card.classList.add("voted-winner");
        else                                  card.classList.add("voted-loser");
    });

    // Fire-and-forget to Google Sheets
    const params = new URLSearchParams({
        action:    "saveVote",
        winnerId:  winner.id,
        loserId:   loser.id,
        sessionId
    });

    jsonp(`${SCRIPT_URL}?${params}`)
        .then(res => {
            if (res.status === "success") {
                setStatus(`${totalVotes} vote${totalVotes !== 1 ? "s" : ""} recorded`, "ok");
            } else {
                console.warn("Sheet error:", res.error);
                setStatus("Saved locally only", "offline");
            }
        })
        .catch(() => setStatus("Offline — saved locally", "offline"));

    // Next matchup
    setTimeout(() => {
        currentPair = getRandomPair();
        renderMatchup();
        updateRankingDisplay();
        locked = false;
    }, 300);
}

// ─────────────────────────────────────────────
//  Show / hide results
// ─────────────────────────────────────────────
function showResults() {
    updateRankingDisplay();
    document.getElementById("votingPanel").style.display  = "none";
    document.getElementById("resultsPanel").style.display = "block";
}

function hideResults() {
    document.getElementById("votingPanel").style.display  = "block";
    document.getElementById("resultsPanel").style.display = "none";
    currentPair = getRandomPair();
    renderMatchup();
}

// ─────────────────────────────────────────────
//  Init
// ─────────────────────────────────────────────
async function init() {
    setStatus("Loading…", "");
    const ok = await fetchItems();
    if (!ok) return;

    currentPair = getRandomPair();
    renderMatchup();
    updateRankingDisplay();
    setStatus("Ready — pick your favorite kit", "ok");

    document.getElementById("vsContainer").addEventListener("click", e => {
        const card = e.target.closest(".choice-card");
        if (card?.dataset?.choice) recordVote(card.dataset.choice);
    });

    document.getElementById("resultsBtn").addEventListener("click", showResults);
    document.getElementById("backBtn").addEventListener("click", hideResults);
}

init();
</script>
</body>
</html>
