<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Group Priority Ranker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: system-ui, 'Segoe UI', monospace;
            background: #f5f3f0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1300px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2rem;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .sub {
            color: #555;
            margin-top: 5px;
        }
        .rank-status {
            background: #e9e6e2;
            padding: 8px 16px;
            border-radius: 60px;
            display: inline-block;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .matchup-area {
            background: white;
            border-radius: 48px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
            padding: 20px 15px 30px 15px;
            margin-bottom: 30px;
        }
        .vs-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }
        .card {
            flex: 1;
            min-width: 240px;
            background: #fefcf9;
            border-radius: 36px;
            padding: 28px 12px 28px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid #e2ddd6;
            box-shadow: 0 6px 0 #ddd8d0;
        }
        .card:hover {
            transform: translateY(-4px);
            background: #fffaf2;
            border-color: #cbc3b8;
        }
        .card:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ddd8d0;
        }
        .item-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 15px 0 8px;
            word-break: break-word;
        }
        .vs-badge {
            font-size: 2rem;
            font-weight: 800;
            background: #2c2a27;
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }
        .button-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }
        button {
            background: #1e1b18;
            border: none;
            color: white;
            font-size: 1rem;
            padding: 10px 24px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.1s linear;
        }
        button:active { transform: scale(0.97); }
        .results-section {
            background: #fff;
            border-radius: 36px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        .rank-list {
            list-style: none;
            padding: 0;
        }
        .rank-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid #ece7e1;
            font-size: 1.2rem;
        }
        .rank-number {
            font-weight: bold;
            background: #e6e0d8;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 34px;
        }
        .score-badge {
            margin-left: auto;
            font-family: monospace;
            background: #f0ede8;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 0.8rem;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-style: italic;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.75rem;
            color: #777;
        }
        .vote-counter {
            font-size: 0.9rem;
            margin-top: 15px;
            text-align: center;
            color: #666;
        }
        @media (max-width: 700px) {
            .item-name { font-size: 1.3rem; }
            .card { padding: 18px 8px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 Group Priority Ranker</h1>
        <div class="sub">Click the item that matters MORE to the group</div>
        <div class="rank-status" id="voteCountDisplay">Ready to rank!</div>
    </div>

    <div class="matchup-area" id="matchupArea">
        <div class="vs-container" id="vsContainer">
            <div class="loading">Loading items...</div>
        </div>
        <div class="button-bar">
            <button id="resultsBtn">📈 View Ranking & Results</button>
        </div>
        <div class="vote-counter" id="voteCounter"></div>
    </div>

    <div class="results-section" id="resultsPanel" style="display: none;">
        <h3>🏆 Current Group Priority Ranking</h3>
        <div id="resultsList" class="rank-list">Loading ranking...</div>
        <div style="margin-top: 20px; text-align: right;">
            <button id="closeResults">← Back to voting</button>
        </div>
    </div>
    <footer>Every vote updates the ranking. Higher score = higher priority to the group.</footer>
</div>

<script>
    // DEFAULT ITEMS (works without Google Sheets)
    const DEFAULT_ITEMS = [
        { id: "1", name: "✅ Fast loading speed" },
        { id: "2", name: "🎨 Beautiful design" },
        { id: "3", name: "📱 Mobile friendly" },
        { id: "4", name: "🔒 Security features" },
        { id: "5", name: "📊 Analytics dashboard" },
        { id: "6", name: "💬 User support chat" }
    ];
    
    // CONFIG - Add your Google Sheets URL here if desired
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygtRKNugzWk7F5M28Uy-6xZKyA5vuAK901o2ZnJaReXGrV1BGLeP9CWAdAavBWi36g/exec";  // Leave empty to use default items
    
    // GLOBALS
    let allItems = [];
    let currentPair = { a: null, b: null };
    let sessionId = localStorage.getItem("ranker_session");
    let totalVotes = 0;
    
    if (!sessionId) {
        sessionId = "sess_" + Date.now() + "_" + Math.random().toString(36).substr(2, 8);
        localStorage.setItem("ranker_session", sessionId);
    }
    
    // Elo constants
    const K_FACTOR = 32;
    const DEFAULT_ELO = 1500;
    
    // Load items from localStorage or defaults
    function loadItems() {
        let storedRatings = {};
        try {
            storedRatings = JSON.parse(localStorage.getItem("item_elos") || "{}");
        } catch(e) {}
        
        // Use default items if no Google Sheets URL
        if (!SCRIPT_URL) {
            allItems = DEFAULT_ITEMS.map(it => ({
                id: it.id,
                name: it.name,
                elo: storedRatings[it.id] || DEFAULT_ELO
            }));
            return true;
        }
        
        // Otherwise try to load from Sheets (but default works immediately)
        return false;
    }
    
    // Persist Elo to localStorage
    function persistElos() {
        let obj = {};
        allItems.forEach(it => { obj[it.id] = it.elo; });
        localStorage.setItem("item_elos", JSON.stringify(obj));
    }
    
    // Get random pair of items
    function getRandomPair() {
        if (!allItems || allItems.length < 2) return null;
        
        // Get indices ensuring they're different
        let idxA = Math.floor(Math.random() * allItems.length);
        let idxB = Math.floor(Math.random() * allItems.length);
        while (idxA === idxB && allItems.length > 1) {
            idxB = Math.floor(Math.random() * allItems.length);
        }
        
        return { a: allItems[idxA], b: allItems[idxB] };
    }
    
    // Render the two cards
    function renderMatchup() {
        const container = document.getElementById("vsContainer");
        if (!currentPair.a || !currentPair.b) {
            container.innerHTML = "<div class='loading'>Not enough items to compare</div>";
            return;
        }
        
        container.innerHTML = `
            <div class="card" data-choice="${currentPair.a.id}">
                <div style="font-size: 2rem;">🔹</div>
                <div class="item-name">${escapeHtml(currentPair.a.name)}</div>
                <div style="font-size:0.8rem; margin-top:12px; color:#2c7a4d;">← MORE IMPORTANT</div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="card" data-choice="${currentPair.b.id}">
                <div style="font-size: 2rem;">🔸</div>
                <div class="item-name">${escapeHtml(currentPair.b.name)}</div>
                <div style="font-size:0.8rem; margin-top:12px; color:#2c7a4d;">MORE IMPORTANT →</div>
            </div>
        `;
    }
    
    // Record a vote and update Elo ratings
    async function recordVote(winnerId) {
        console.log("Vote recorded for:", winnerId);
        
        const winner = allItems.find(i => i.id === winnerId);
        const loser = (currentPair.a.id === winnerId) ? currentPair.b : currentPair.a;
        
        if (!winner || !loser) {
            console.error("Could not find winner or loser");
            return;
        }
        
        console.log(`Vote: ${winner.name} beats ${loser.name}`);
        
        // Calculate Elo changes
        const expectedWinner = 1 / (1 + Math.pow(10, (loser.elo - winner.elo) / 400));
        const expectedLoser = 1 / (1 + Math.pow(10, (winner.elo - loser.elo) / 400));
        
        winner.elo = winner.elo + K_FACTOR * (1 - expectedWinner);
        loser.elo = loser.elo + K_FACTOR * (0 - expectedLoser);
        
        persistElos();
        totalVotes++;
        
        // Update display
        const voteCounter = document.getElementById("voteCounter");
        if (voteCounter) {
            voteCounter.innerHTML = `📊 ${totalVotes} vote${totalVotes !== 1 ? 's' : ''} recorded`;
        }
        
        // Get next pair
        currentPair = getRandomPair();
        renderMatchup();
        updateRankingDisplay();
    }
    
    // Update the ranking view
    function updateRankingDisplay() {
        const sorted = [...allItems].sort((a,b) => b.elo - a.elo);
        const listDiv = document.getElementById("resultsList");
        if (!listDiv) return;
        
        listDiv.innerHTML = sorted.map((item, idx) => `
            <li>
                <span class="rank-number">${idx+1}</span>
                <strong>${escapeHtml(item.name)}</strong>
                <span class="score-badge">score ${Math.round(item.elo)}</span>
            </li>
        `).join('');
    }
    
    // Show results panel
    function showResults() {
        updateRankingDisplay();
        document.getElementById("matchupArea").style.display = "none";
        document.getElementById("resultsPanel").style.display = "block";
    }
    
    // Hide results panel
    function hideResults() {
        document.getElementById("matchupArea").style.display = "block";
        document.getElementById("resultsPanel").style.display = "none";
        // Refresh to a new pair
        currentPair = getRandomPair();
        renderMatchup();
    }
    
    // Escape HTML
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Reset all rankings (admin function)
    function resetRankings() {
        if (confirm("Reset all rankings? This cannot be undone.")) {
            localStorage.removeItem("item_elos");
            loadItems();
            persistElos();
            totalVotes = 0;
            currentPair = getRandomPair();
            renderMatchup();
            updateRankingDisplay();
            document.getElementById("voteCounter").innerHTML = "";
            alert("Rankings have been reset!");
        }
    }
    
    // Initialize the app
    function init() {
        console.log("Initializing ranker...");
        
        // Load items
        loadItems();
        
        if (allItems.length === 0) {
            console.error("No items loaded!");
            document.getElementById("vsContainer").innerHTML = "<div class='loading'>Error: No items found. Please check configuration.</div>";
            return;
        }
        
        console.log(`Loaded ${allItems.length} items:`, allItems.map(i => i.name));
        
        // Get first random pair
        currentPair = getRandomPair();
        renderMatchup();
        
        // Set up event delegation for clicks on cards
        const container = document.getElementById("vsContainer");
        container.addEventListener('click', function(e) {
            const card = e.target.closest('.card');
            if (card && card.dataset.choice) {
                console.log("Card clicked, choice:", card.dataset.choice);
                const chosenId = card.dataset.choice;
                recordVote(chosenId);
            }
        });
        
        // Set up button listeners
        document.getElementById("resultsBtn").addEventListener("click", showResults);
        document.getElementById("closeResults").addEventListener("click", hideResults);
        
        // Add reset button (optional - uncomment to add)
        // const resetBtn = document.createElement("button");
        // resetBtn.textContent = "🔄 Reset Rankings";
        // resetBtn.style.marginLeft = "10px";
        // resetBtn.onclick = resetRankings;
        // document.querySelector(".button-bar").appendChild(resetBtn);
        
        // Update vote counter display
        const savedVotes = localStorage.getItem("total_votes");
        if (savedVotes) totalVotes = parseInt(savedVotes);
        
        document.getElementById("voteCountDisplay").innerText = `${allItems.length} items ready to rank!`;
        
        console.log("Initialization complete!");
    }
    
    // Save vote count occasionally
    setInterval(() => {
        localStorage.setItem("total_votes", totalVotes);
    }, 5000);
    
    // Start the app
    init();
</script>
</body>
</html>
