<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Group Priority Ranker - Complete All Matchups</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: system-ui, 'Segoe UI', monospace;
            background: #f5f3f0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1300px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2rem;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .sub {
            color: #555;
            margin-top: 5px;
        }
        .progress-bar {
            background: #e9e6e2;
            border-radius: 60px;
            height: 12px;
            margin: 20px auto;
            max-width: 500px;
            overflow: hidden;
        }
        .progress-fill {
            background: #2c7a4d;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 60px;
        }
        .progress-text {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 8px;
            color: #666;
        }
        .matchup-area {
            background: white;
            border-radius: 48px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
            padding: 20px 15px 30px 15px;
            margin-bottom: 30px;
        }
        .vs-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }
        .card {
            flex: 1;
            min-width: 240px;
            background: #fefcf9;
            border-radius: 36px;
            padding: 28px 12px 28px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid #e2ddd6;
            box-shadow: 0 6px 0 #ddd8d0;
        }
        .card:hover {
            transform: translateY(-4px);
            background: #fffaf2;
            border-color: #cbc3b8;
        }
        .card:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ddd8d0;
        }
        .item-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 15px 0 8px;
            word-break: break-word;
        }
        .vs-badge {
            font-size: 2rem;
            font-weight: 800;
            background: #2c2a27;
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }
        button {
            background: #1e1b18;
            border: none;
            color: white;
            font-size: 1rem;
            padding: 12px 28px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.1s linear;
            margin: 10px;
        }
        button:active { transform: scale(0.97); }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .results-section, .completion-section, .name-section {
            background: #fff;
            border-radius: 36px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        .rank-list {
            list-style: none;
            padding: 0;
        }
        .rank-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid #ece7e1;
            font-size: 1.2rem;
        }
        .rank-number {
            font-weight: bold;
            background: #e6e0d8;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 34px;
        }
        .score-badge {
            margin-left: auto;
            font-family: monospace;
            background: #f0ede8;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 0.8rem;
        }
        .loading, .error {
            text-align: center;
            padding: 40px;
        }
        .error {
            color: #d32f2f;
            background: #ffebee;
            border-radius: 24px;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.75rem;
            color: #777;
        }
        .name-input {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #e2ddd6;
            border-radius: 60px;
            margin: 20px 0;
            text-align: center;
        }
        .completion-stats {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 24px;
        }
        @media (max-width: 700px) {
            .item-name { font-size: 1.3rem; }
            .card { padding: 18px 8px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 Group Priority Ranker</h1>
        <div class="sub">Compare ALL options to find what matters most</div>
    </div>

    <!-- Name Collection Section -->
    <div id="nameSection" class="name-section">
        <h3>👋 Welcome! Please enter your name to begin</h3>
        <input type="text" id="userName" class="name-input" placeholder="Your name (e.g., John Smith)" autocomplete="off">
        <div style="text-align: center;">
            <button id="startRankingBtn">Start Ranking →</button>
        </div>
    </div>

    <!-- Main Ranking Section (hidden initially) -->
    <div id="rankingSection" style="display: none;">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Matchup 0 of 0</div>

        <div class="matchup-area">
            <div class="vs-container" id="vsContainer">
                <div class="loading">Loading items...</div>
            </div>
            <div class="vote-counter" id="voteCounter"></div>
        </div>
    </div>

    <!-- Completion Section (shown when all matchups done) -->
    <div id="completionSection" style="display: none;" class="completion-section">
        <h3>🎉 You've completed all comparisons!</h3>
        <div class="completion-stats" id="completionStats"></div>
        <h4>🏆 Final Group Priority Rankings</h4>
        <div id="finalRankings" class="rank-list"></div>
        <div style="text-align: center; margin-top: 30px;">
            <button id="restartBtn">🔄 Start Over</button>
        </div>
    </div>

    <footer>You must compare every possible pair. Each vote helps determine true priorities.</footer>
</div>

<script>
    // ========== CONFIGURATION ==========
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwJMWIpi_LMtFcbfDxqHdVahrvVcqhm_jCxPKfxoFEUW-fEKNomVSqjfxgrkGSYRiF2/exec";
    // ====================================
    
    // GLOBALS
    let allItems = [];
    let remainingPairs = [];
    let currentPair = null;
    let userName = "";
    let sessionId = localStorage.getItem("ranker_session");
    let votesCast = 0;
    let totalPairs = 0;
    
    if (!sessionId) {
        sessionId = "sess_" + Date.now() + "_" + Math.random().toString(36).substr(2, 8);
        localStorage.setItem("ranker_session", sessionId);
    }
    
    // Elo constants
    const K_FACTOR = 32;
    const DEFAULT_ELO = 1500;
    
    // Generate all unique pairs (combinations)
    function generateAllPairs(items) {
        const pairs = [];
        for (let i = 0; i < items.length; i++) {
            for (let j = i + 1; j < items.length; j++) {
                pairs.push({ a: items[i], b: items[j] });
            }
        }
        return pairs;
    }
    
    // Load saved progress from localStorage
    function loadProgress() {
        const saved = localStorage.getItem(`ranker_progress_${sessionId}`);
        if (saved) {
            try {
                const progress = JSON.parse(saved);
                if (progress.remainingPairs && progress.remainingPairs.length > 0) {
                    remainingPairs = progress.remainingPairs;
                    votesCast = progress.votesCast || 0;
                    updateProgressDisplay();
                    return true;
                }
            } catch(e) {}
        }
        return false;
    }
    
    // Save progress to localStorage
    function saveProgress() {
        const progress = {
            remainingPairs: remainingPairs,
            votesCast: votesCast,
            timestamp: Date.now()
        };
        localStorage.setItem(`ranker_progress_${sessionId}`, JSON.stringify(progress));
    }
    
    // Clear progress
    function clearProgress() {
        localStorage.removeItem(`ranker_progress_${sessionId}`);
    }
    
    // Update progress bar and text
    function updateProgressDisplay() {
        const completed = totalPairs - remainingPairs.length;
        const percent = (completed / totalPairs) * 100;
        const fill = document.getElementById("progressFill");
        const text = document.getElementById("progressText");
        if (fill) fill.style.width = `${percent}%`;
        if (text) text.innerHTML = `Matchup ${completed} of ${totalPairs} complete`;
    }
    
    // Load items from Google Sheets
    async function fetchItemsFromSheets() {
        if (!SCRIPT_URL || SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
            alert("Please configure SCRIPT_URL in the code");
            return false;
        }
        
        try {
            const url = `${SCRIPT_URL}?action=getItems&t=${Date.now()}`;
            const resp = await fetch(url);
            const items = await resp.json();
            
            if (items.error) throw new Error(items.error);
            if (!items || items.length < 2) throw new Error("Need at least 2 items");
            
            // Load stored Elo ratings
            let storedRatings = {};
            try {
                storedRatings = JSON.parse(localStorage.getItem("item_elos") || "{}");
            } catch(e) {}
            
            allItems = items.map(it => ({
                id: String(it.id),
                name: it.name,
                elo: storedRatings[it.id] || DEFAULT_ELO
            }));
            
            // Generate all possible pairs
            const allPairs = generateAllPairs(allItems);
            totalPairs = allPairs.length;
            
            // Load saved progress or use all pairs
            const hasProgress = loadProgress();
            if (!hasProgress) {
                remainingPairs = allPairs;
                votesCast = 0;
                saveProgress();
            }
            
            updateProgressDisplay();
            return true;
            
        } catch (err) {
            console.error(err);
            alert(`Error loading items: ${err.message}`);
            return false;
        }
    }
    
    // Save vote to Google Sheets
    async function saveVoteToSheets(winnerId, loserId) {
        try {
            const params = new URLSearchParams();
            params.append("action", "saveVote");
            params.append("winnerId", winnerId);
            params.append("loserId", loserId);
            params.append("sessionId", sessionId);
            params.append("userName", userName);
            
            await fetch(`${SCRIPT_URL}?${params.toString()}`);
            return true;
        } catch (err) {
            console.warn("Could not save vote:", err);
            return false;
        }
    }
    
    // Save completion to sheets
    async function saveCompletionToSheets() {
        try {
            const sorted = [...allItems].sort((a,b) => b.elo - a.elo);
            const rankings = sorted.map((item, idx) => `${idx+1}. ${item.name} (${Math.round(item.elo)})`).join(" | ");
            
            const params = new URLSearchParams();
            params.append("action", "saveCompletion");
            params.append("sessionId", sessionId);
            params.append("userName", userName);
            params.append("rankings", rankings);
            params.append("totalVotes", votesCast);
            
            await fetch(`${SCRIPT_URL}?${params.toString()}`);
        } catch (err) {
            console.warn("Could not save completion:", err);
        }
    }
    
    // Update Elo ratings
    function updateElo(winner, loser) {
        const expectedWinner = 1 / (1 + Math.pow(10, (loser.elo - winner.elo) / 400));
        const expectedLoser = 1 / (1 + Math.pow(10, (winner.elo - loser.elo) / 400));
        
        winner.elo = winner.elo + K_FACTOR * (1 - expectedWinner);
        loser.elo = loser.elo + K_FACTOR * (0 - expectedLoser);
        
        // Persist to localStorage
        let obj = {};
        allItems.forEach(it => { obj[it.id] = it.elo; });
        localStorage.setItem("item_elos", JSON.stringify(obj));
    }
    
    // Record a vote
    async function recordVote(winnerItem, loserItem) {
        // Update Elo
        updateElo(winnerItem, loserItem);
        
        // Save to Google Sheets
        await saveVoteToSheets(winnerItem.id, loserItem.id);
        
        votesCast++;
        
        // Remove current pair from remaining
        remainingPairs = remainingPairs.filter(pair => 
            !(pair.a.id === currentPair.a.id && pair.b.id === currentPair.b.id)
        );
        
        saveProgress();
        updateProgressDisplay();
        
        // Check if complete
        if (remainingPairs.length === 0) {
            await completeRanking();
        } else {
            // Load next pair
            loadNextPair();
        }
    }
    
    // Load next random pair
    function loadNextPair() {
        if (remainingPairs.length === 0) return;
        
        const randomIndex = Math.floor(Math.random() * remainingPairs.length);
        currentPair = remainingPairs[randomIndex];
        renderMatchup();
    }
    
    // Render the two cards
    function renderMatchup() {
        const container = document.getElementById("vsContainer");
        if (!currentPair) {
            container.innerHTML = "<div class='loading'>Loading...</div>";
            return;
        }
        
        container.innerHTML = `
            <div class="card" data-choice="${currentPair.a.id}">
                <div style="font-size: 2rem;">🔹</div>
                <div class="item-name">${escapeHtml(currentPair.a.name)}</div>
                <div style="font-size:0.8rem; margin-top:12px; color:#2c7a4d;">← MORE IMPORTANT</div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="card" data-choice="${currentPair.b.id}">
                <div style="font-size: 2rem;">🔸</div>
                <div class="item-name">${escapeHtml(currentPair.b.name)}</div>
                <div style="font-size:0.8rem; margin-top:12px; color:#2c7a4d;">MORE IMPORTANT →</div>
            </div>
        `;
    }
    
    // Show final rankings when complete
    async function completeRanking() {
        // Save completion to sheets
        await saveCompletionToSheets();
        
        // Sort by Elo
        const sorted = [...allItems].sort((a,b) => b.elo - a.elo);
        
        // Display completion screen
        const completionDiv = document.getElementById("completionSection");
        const rankingDiv = document.getElementById("rankingSection");
        const statsDiv = document.getElementById("completionStats");
        const finalRankingsDiv = document.getElementById("finalRankings");
        
        statsDiv.innerHTML = `
            ✅ You compared ${totalPairs} pairs<br>
            📊 Final rankings calculated using Elo rating system<br>
            👤 Voter: ${escapeHtml(userName)}
        `;
        
        finalRankingsDiv.innerHTML = sorted.map((item, idx) => `
            <li>
                <span class="rank-number">${idx+1}</span>
                <strong>${escapeHtml(item.name)}</strong>
                <span class="score-badge">priority score ${Math.round(item.elo)}</span>
            </li>
        `).join('');
        
        rankingDiv.style.display = "none";
        completionDiv.style.display = "block";
        
        // Clear progress since they're done
        clearProgress();
    }
    
    // Start the ranking process
    async function startRanking() {
        const nameInput = document.getElementById("userName");
        userName = nameInput.value.trim();
        
        if (!userName) {
            alert("Please enter your name to continue");
            return;
        }
        
        // Load items from Google Sheets
        const success = await fetchItemsFromSheets();
        if (!success) return;
        
        if (remainingPairs.length === 0) {
            alert("No pairs to compare! Add more items to your sheet.");
            return;
        }
        
        // Hide name section, show ranking section
        document.getElementById("nameSection").style.display = "none";
        document.getElementById("rankingSection").style.display = "block";
        
        // Load first pair
        loadNextPair();
        
        // Set up click handler
        const container = document.getElementById("vsContainer");
        container.addEventListener('click', function(e) {
            const card = e.target.closest('.card');
            if (card && card.dataset.choice && currentPair) {
                const chosenId = card.dataset.choice;
                const winner = chosenId === currentPair.a.id ? currentPair.a : currentPair.b;
                const loser = chosenId === currentPair.a.id ? currentPair.b : currentPair.a;
                recordVote(winner, loser);
            }
        });
    }
    
    // Restart for new user
    function restart() {
        // Clear all progress
        clearProgress();
        localStorage.removeItem("item_elos");
        
        // Reset UI
        document.getElementById("completionSection").style.display = "none";
        document.getElementById("rankingSection").style.display = "none";
        document.getElementById("nameSection").style.display = "block";
        document.getElementById("userName").value = "";
        
        // Reset globals
        allItems = [];
        remainingPairs = [];
        currentPair = null;
        votesCast = 0;
    }
    
    // Escape HTML
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Event listeners
    document.getElementById("startRankingBtn").addEventListener("click", startRanking);
    document.getElementById("restartBtn").addEventListener("click", restart);
</script>
</body>
</html>
