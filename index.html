<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ATL UTD KIT RANKER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

        :root {
--ink:    #FFFFFF;
--ink2:   #FEBE10;
--ink3:   #FEBE10;
--paper:  #0a0a0a;
--card:   #111111;
--border: #9E2A2F;
--accent: #9E2A2F;
--accent2:#FEBE10;
--gold:   #FEBE10;
--radius: 16px;
--shadow: 0 2px 0 #9E2A2F;
        }

        body {
            font-family: 'Oswald', sans-serif;
            background: var(--paper);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--ink);
        }

        /* ── Login Screen ── */
        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--paper);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
            transition: opacity 0.3s ease;
        }
        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 32px 24px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: var(--shadow);
            animation: fadeUp 0.4s ease;
        }
        .login-card h2 {
            font-size: 1.6rem;
            margin-bottom: 8px;
        }
        .login-card h2 em {
            color: var(--accent);
            font-style: italic;
        }
        .login-sub {
            font-size: 0.8rem;
            color: var(--ink2);
            margin-bottom: 24px;
        }
        .login-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            font-family: 'Oswald', sans-serif;
            background: var(--paper);
            border: 1.5px solid var(--border);
            border-radius: 60px;
            color: var(--ink);
            text-align: center;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        .login-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .login-input::placeholder {
            color: var(--ink3);
            font-size: 0.85rem;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 60px;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        .login-btn:hover {
            background: var(--accent);
            color: #fff;
        }
        .login-btn:active {
            transform: scale(0.97);
        }
        .login-error {
            color: var(--accent);
            font-size: 0.75rem;
            margin-top: 12px;
        }

        /* ── Main App (hidden until login) ── */
        .app-container {
            display: none;
            width: 100%;
            max-width: 780px;
            flex-direction: column;
            align-items: center;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }
        .eyebrow {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
        }
        h1 {
            font-family: 'Oswald', serif;
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            font-weight: 500;
            line-height: 1.2;
            letter-spacing: -0.3px;
            color: var(--ink);
        }
        h1 em { font-style: italic; color: var(--accent); }
        .sub {
            font-size: 0.75rem;
            color: var(--ink2);
            margin-top: 6px;
        }
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 60px;
            padding: 6px 12px 6px 16px;
            margin-top: 12px;
            font-size: 0.75rem;
        }
        .user-name {
            color: var(--gold);
            font-weight: 500;
        }
        .logout-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--ink2);
            padding: 4px 12px;
            border-radius: 60px;
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            font-size: 0.7rem;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--ink2);
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 60px;
        }
        .pill-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }
        .pill-dot.ok { background: #5cad6b; }

        /* ── Main panel ── */
        .panel {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px 16px 20px;
            margin-bottom: 12px;
        }

        /* ── VS layout ── */
        .vs-row {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 8px;
        }
        .choice-card {
            flex: 1;
            background: var(--paper);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 10px 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
            position: relative;
            box-shadow: var(--shadow);
        }
        .choice-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            background: #1a1a1a;
        }
        .choice-card:active {
            transform: translateY(1px) scale(0.98);
        }
        .choice-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .choice-card.voted-winner {
            border-color: #5cad6b;
            background: #1a2a1a;
            animation: winPulse 0.3s ease;
        }
        .choice-card.voted-loser {
            opacity: 0.4;
            transform: scale(0.97);
        }
        @keyframes winPulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .card-img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 8px;
            background: var(--border);
            display: block;
        }
        .card-rank-hint {
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink3);
            margin-bottom: 6px;
        }
        .card-name {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.85rem, 3.5vw, 1.2rem);
            font-weight: 500;
            line-height: 1.2;
            word-break: break-word;
            color: var(--ink);
            margin: 3px 0 6px;
        }

        .vs-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            width: auto;
            flex-shrink: 0;
        }
        .vs-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--gold);
            color: #000;
            font-size: 0.65rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .btn {
            border: 1.5px solid var(--border);
            background: var(--card);
            color: var(--ink);
            font-family: 'Oswald', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.12s, border-color 0.12s, transform 0.1s;
        }
        .btn:hover  { background: var(--accent2); border-color: var(--accent); color: #000; }
        .btn:active { transform: scale(0.97); }
        .btn.primary { background: var(--gold); color: #000; border-color: var(--gold); }
        .btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* ── Results panel ── */
        #resultsPanel { display: none; }
        .results-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 16px;
        }
        .rank-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .rank-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--paper);
        }
        .rank-item:first-child { background: #1a1a0a; border-color: var(--gold); }
        .rank-num {
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--ink3);
            width: 20px;
            text-align: center;
        }
        .rank-item:first-child .rank-num { color: var(--gold); }
        .rank-name {
            font-size: 0.85rem;
            font-weight: 500;
            flex: 1;
        }
        .rank-bar-wrap {
            width: 60px;
            height: 3px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }
        .rank-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.6s ease;
        }
        .rank-item:first-child .rank-bar { background: var(--gold); }
        .rank-elo {
            font-family: 'Oswald', monospace;
            font-size: 0.7rem;
            color: var(--ink3);
            width: 38px;
            text-align: right;
        }
        .rank-thumb {
            width: 28px;
            height: 42px;
            object-fit: cover;
            border-radius: 6px;
            background: var(--border);
        }

        .loading-state {
            text-align: center;
            padding: 30px 16px;
            color: var(--ink2);
        }
        .spinner {
            width: 24px; height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer {
            font-size: 0.6rem;
            color: var(--ink3);
            text-align: center;
            margin-top: 8px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .panel { padding: 14px 12px 16px; }
            .choice-card { padding: 10px 8px 10px; }
            .vs-circle { width: 28px; height: 28px; font-size: 0.55rem; }
            .card-name { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-container" id="loginContainer">
    <div class="login-card">
        <h2>ATL UTD <em>Kit Ranker</em></h2>
        <div class="login-sub">Enter your name to join the ranking</div>
        <input type="text" class="login-input" id="usernameInput" placeholder="Your name" maxlength="30" autocomplete="off">
        <button class="login-btn" id="loginBtn">Continue →</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>

<!-- MAIN APP (hidden until login) -->
<div class="app-container" id="appContainer">
    <div class="header">
        <div class="eyebrow">5-Stripes Decision Tool</div>
        <h1>ATL UTD <em>Kit Ranker</em></h1>
        <div class="sub">Pick the kit that hits different</div>
        <div class="user-bar">
            <span>👤 <span class="user-name" id="displayName"></span></span>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
        <div class="pill" id="statusPill" style="margin-top: 12px;">
            <span class="pill-dot" id="statusDot"></span>
            <span id="statusText">Loading…</span>
        </div>
    </div>

    <div class="panel" id="votingPanel">
        <div class="vs-row" id="vsContainer">
            <div class="loading-state">
                <div class="spinner"></div>
                Loading kits from your sheet…
            </div>
        </div>
        <div class="action-bar">
            <button class="btn primary" id="resultsBtn">View ranking</button>
        </div>
    </div>

    <div class="panel" id="resultsPanel">
        <div class="results-title">🏆 Final ranking</div>
        <ul class="rank-list" id="rankList"></ul>
        <div class="action-bar">
            <button class="btn" id="backBtn">← Back to voting</button>
        </div>
    </div>

    <footer>Every vote updates the ranking — you can't vote on the same matchup twice.</footer>
</div>

<script>
// ─────────────────────────────────────────────
//  CONFIG
// ─────────────────────────────────────────────
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypt-e4Gpn8qM7sfhtGLUJBYRRmFblKhqZ9rqQAzbQmp9dtcLW4e5nUvGttmd-hrR27/exec";
const K_FACTOR = 32;
const DEFAULT_ELO = 1500;

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let allItems = [];
let currentPair = { a: null, b: null };
let totalVotes = 0;
let locked = false;
let currentUser = null;

// Track which pairs this user has already voted on
// Format: "winnerId:loserId" or "loserId:winnerId" (always sorted)
let votedPairs = new Set();

// Session ID for server tracking
let sessionId = localStorage.getItem("ranker_session");
if (!sessionId) {
    sessionId = "sess_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("ranker_session", sessionId);
}

// ─────────────────────────────────────────────
//  Helper functions
// ─────────────────────────────────────────────
function esc(str) {
    return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;',
        '"': '&quot;', "'": '&#39;'
    })[c]);
}

function setStatus(text, state) {
    document.getElementById("statusText").textContent = text;
    const dot = document.getElementById("statusDot");
    dot.className = "pill-dot" + (state ? " " + state : "");
}

function persistElos() {
    const obj = {};
    allItems.forEach(it => { obj[String(it.id)] = it.elo; });
    localStorage.setItem("item_elos", JSON.stringify(obj));
}

function loadStoredElos() {
    try { return JSON.parse(localStorage.getItem("item_elos") || "{}"); }
    catch { return {}; }
}

// Load voted pairs from localStorage for this user
function loadVotedPairs() {
    if (!currentUser) return;
    const key = `voted_pairs_${currentUser}`;
    const stored = localStorage.getItem(key);
    if (stored) {
        votedPairs = new Set(JSON.parse(stored));
    } else {
        votedPairs = new Set();
    }
}

// Save voted pairs to localStorage
function saveVotedPairs() {
    if (!currentUser) return;
    const key = `voted_pairs_${currentUser}`;
    localStorage.setItem(key, JSON.stringify([...votedPairs]));
}

// Get unique pair key (sorted IDs so order doesn't matter)
function getPairKey(id1, id2) {
    const ids = [String(id1), String(id2)].sort();
    return `${ids[0]}:${ids[1]}`;
}

// Check if user has already voted on this pair
function hasVotedOnPair(a, b) {
    const key = getPairKey(a.id, b.id);
    return votedPairs.has(key);
}

// Mark pair as voted
function markPairAsVoted(a, b) {
    const key = getPairKey(a.id, b.id);
    votedPairs.add(key);
    saveVotedPairs();
}

// ─────────────────────────────────────────────
//  JSONP request
// ─────────────────────────────────────────────
function jsonp(url) {
    return new Promise((resolve, reject) => {
        const cbName = "_cb_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
        const script = document.createElement("script");
        const timer = setTimeout(() => {
            cleanup();
            reject(new Error("Request timed out"));
        }, 10000);

        window[cbName] = data => { cleanup(); resolve(data); };

        function cleanup() {
            clearTimeout(timer);
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
        }

        script.onerror = () => { cleanup(); reject(new Error("Script load failed")); };
        script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cbName;
        document.head.appendChild(script);
    });
}

// ─────────────────────────────────────────────
//  Fetch items from Google Sheets
// ─────────────────────────────────────────────
async function fetchItems() {
    try {
        const items = await jsonp(`${SCRIPT_URL}?action=getItems`);
        
        if (items.error) throw new Error(items.error);
        if (!Array.isArray(items) || items.length < 2)
            throw new Error("Need at least 2 items in the Items sheet.");
        
        allItems = items.map(it => ({
            id: String(it.id),
            name: String(it.name),
            imageURL: String(it.imageURL || ""),
            elo: Number(it.elo) || DEFAULT_ELO
        }));
        
        persistElos();
        return true;
    } catch (err) {
        console.error(err);
        document.getElementById("vsContainer").innerHTML = `
            <div class="loading-state">
                <div style="font-size:1.4rem;">⚠️</div>
                <strong>${esc(err.message)}</strong>
            </div>`;
        setStatus("Connection error", "");
        return false;
    }
}

// ─────────────────────────────────────────────
//  Get a random pair that user hasn't voted on yet
// ─────────────────────────────────────────────
function getUnvotedPair() {
    if (allItems.length < 2) return null;
    
    // Get all possible pairs that haven't been voted on
    const availablePairs = [];
    for (let i = 0; i < allItems.length; i++) {
        for (let j = i + 1; j < allItems.length; j++) {
            if (!hasVotedOnPair(allItems[i], allItems[j])) {
                availablePairs.push({ a: allItems[i], b: allItems[j] });
            }
        }
    }
    
    if (availablePairs.length === 0) {
        // User has voted on all possible pairs! Reset for them? Or show message.
        return null;
    }
    
    const randomIndex = Math.floor(Math.random() * availablePairs.length);
    return availablePairs[randomIndex];
}

// ─────────────────────────────────────────────
//  Get random pair (with duplicate prevention)
// ─────────────────────────────────────────────
function getRandomPair() {
    const unvoted = getUnvotedPair();
    if (!unvoted) {
        // All pairs voted! Show completion message
        return null;
    }
    return unvoted;
}

// ─────────────────────────────────────────────
//  Render matchup
// ─────────────────────────────────────────────
function renderMatchup() {
    const c = document.getElementById("vsContainer");
    if (!currentPair?.a || !currentPair?.b) {
        c.innerHTML = `<div class="loading-state">
            <div style="font-size:2rem; margin-bottom:8px;">🏆</div>
            <strong>You've voted on every pairing!</strong>
            <div style="font-size:0.75rem; margin-top:8px;">Check the rankings to see the results.</div>
        </div>`;
        return;
    }
    const { a, b } = currentPair;
    const imgA = a.imageURL ? `<img class="card-img" src="${esc(a.imageURL)}" alt="${esc(a.name)}" draggable="false" loading="lazy">` : `<div class="card-img" style="background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.7rem;">No image</div>`;
    const imgB = b.imageURL ? `<img class="card-img" src="${esc(b.imageURL)}" alt="${esc(b.name)}" draggable="false" loading="lazy">` : `<div class="card-img" style="background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.7rem;">No image</div>`;
    c.innerHTML = `
        <div class="choice-card" data-choice="${esc(a.id)}">
            ${imgA}
            <div class="card-rank-hint">Option A</div>
            <div class="card-name">${esc(a.name)}</div>
        </div>
        <div class="vs-divider"><div class="vs-circle">VS</div></div>
        <div class="choice-card" data-choice="${esc(b.id)}">
            ${imgB}
            <div class="card-rank-hint">Option B</div>
            <div class="card-name">${esc(b.name)}</div>
        </div>`;
}

// ─────────────────────────────────────────────
//  Update ranking display
// ─────────────────────────────────────────────
function updateRankingDisplay() {
    const sorted = [...allItems].sort((a, b) => b.elo - a.elo);
    const maxElo = sorted[0]?.elo ?? DEFAULT_ELO;
    const minElo = sorted[sorted.length - 1]?.elo ?? DEFAULT_ELO;
    const eloRange = maxElo - minElo || 1;

    const list = document.getElementById("rankList");
    list.innerHTML = sorted.map((item, i) => {
        const pct = Math.round(((item.elo - minElo) / eloRange) * 100);
        const thumb = item.imageURL ? `<img class="rank-thumb" src="${esc(item.imageURL)}" alt="">` : `<div class="rank-thumb" style="background: var(--border);"></div>`;
        return `
            <li class="rank-item">
                <span class="rank-num">${i + 1}</span>
                ${thumb}
                <span class="rank-name">${esc(item.name)}</span>
                <div class="rank-bar-wrap">
                    <div class="rank-bar" style="width:${pct}%"></div>
                </div>
                <span class="rank-elo">${Math.round(item.elo)}</span>
            </li>`;
    }).join("");
}

// ─────────────────────────────────────────────
//  Refresh global rankings from server
// ─────────────────────────────────────────────
async function refreshGlobalRankings() {
    try {
        const items = await jsonp(`${SCRIPT_URL}?action=getItems`);
        if (items.error) throw new Error(items.error);
        if (!Array.isArray(items)) return;
        
        items.forEach(serverItem => {
            const localItem = allItems.find(i => i.id === String(serverItem.id));
            if (localItem) {
                localItem.elo = serverItem.elo;
            }
        });
        
        persistElos();
        updateRankingDisplay();
    } catch (err) {
        console.warn("Failed to refresh global rankings:", err);
    }
}

// ─────────────────────────────────────────────
//  Record a vote
// ─────────────────────────────────────────────
async function recordVote(winnerId) {
    if (locked) return;
    
    const winner = allItems.find(i => i.id === winnerId);
    const loser = currentPair.a.id === winnerId ? currentPair.b : currentPair.a;
    if (!winner || !loser) return;
    
    // Double-check: prevent voting on same pair twice
    if (hasVotedOnPair(winner, loser)) {
        setStatus("You already voted on this matchup!", "offline");
        setTimeout(() => setStatus("Ready — pick your favorite kit", "ok"), 2000);
        return;
    }
    
    locked = true;

    // Animate cards
    const cards = document.querySelectorAll(".choice-card");
    cards.forEach(card => {
        if (card.dataset.choice === winnerId) card.classList.add("voted-winner");
        else card.classList.add("voted-loser");
    });

    // Mark this pair as voted BEFORE sending to prevent double-click issues
    markPairAsVoted(winner, loser);

    // Send vote to server
    const params = new URLSearchParams({
        action: "saveVote",
        winnerId: winner.id,
        loserId: loser.id,
        sessionId: sessionId,
        username: currentUser
    });

    try {
        const result = await jsonp(`${SCRIPT_URL}?${params}`);
        
        if (result.status === "success") {
            totalVotes++;
            setStatus(`${totalVotes} vote${totalVotes !== 1 ? "s" : ""} recorded`, "ok");
            await refreshGlobalRankings();
        } else {
            throw new Error(result.error || "Unknown error");
        }
    } catch (err) {
        console.warn("Failed to save vote:", err);
        setStatus("Offline — vote saved locally", "offline");
        
        // Fallback local update
        const expWin = 1 / (1 + Math.pow(10, (loser.elo - winner.elo) / 400));
        winner.elo += K_FACTOR * (1 - expWin);
        loser.elo += K_FACTOR * (0 - expWin);
        persistElos();
        totalVotes++;
        updateRankingDisplay();
    }

    // Get next matchup after delay
    setTimeout(() => {
        currentPair = getRandomPair();
        renderMatchup();
        locked = false;
    }, 300);
}

// ─────────────────────────────────────────────
//  Show/hide results
// ─────────────────────────────────────────────
function showResults() {
    updateRankingDisplay();
    document.getElementById("votingPanel").style.display = "none";
    document.getElementById("resultsPanel").style.display = "block";
}

function hideResults() {
    document.getElementById("votingPanel").style.display = "block";
    document.getElementById("resultsPanel").style.display = "none";
    currentPair = getRandomPair();
    renderMatchup();
}

// ─────────────────────────────────────────────
//  Login logic
// ─────────────────────────────────────────────
function login(username) {
    if (!username || username.trim() === "") {
        document.getElementById("loginError").textContent = "Please enter your name";
        return false;
    }
    
    currentUser = username.trim();
    localStorage.setItem("ranker_user", currentUser);
    
    // Load this user's voted pairs from localStorage
    loadVotedPairs();
    
    // Hide login, show app
    document.getElementById("loginContainer").style.display = "none";
    document.getElementById("appContainer").style.display = "flex";
    document.getElementById("displayName").textContent = currentUser;
    
    // Initialize the app
    initApp();
    return true;
}

function logout() {
    currentUser = null;
    votedPairs.clear();
    localStorage.removeItem("ranker_user");
    
    document.getElementById("loginContainer").style.display = "flex";
    document.getElementById("appContainer").style.display = "none";
    document.getElementById("usernameInput").value = "";
}

// ─────────────────────────────────────────────
//  Initialize app (after login)
// ─────────────────────────────────────────────
async function initApp() {
    setStatus("Loading…", "");
    const ok = await fetchItems();
    if (!ok) return;
    
    currentPair = getRandomPair();
    renderMatchup();
    updateRankingDisplay();
    
    const remainingPairs = getRemainingPairCount();
    setStatus(`Ready — ${remainingPairs} matchups left to vote on`, "ok");
}

function getRemainingPairCount() {
    const totalPairs = (allItems.length * (allItems.length - 1)) / 2;
    const votedCount = votedPairs.size;
    return totalPairs - votedCount;
}

// ─────────────────────────────────────────────
//  Event listeners
// ─────────────────────────────────────────────
document.getElementById("loginBtn").addEventListener("click", () => {
    const input = document.getElementById("usernameInput");
    login(input.value);
});

document.getElementById("usernameInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") {
        login(document.getElementById("usernameInput").value);
    }
});

document.getElementById("logoutBtn").addEventListener("click", logout);
document.getElementById("resultsBtn").addEventListener("click", showResults);
document.getElementById("backBtn").addEventListener("click", hideResults);

document.getElementById("vsContainer").addEventListener("click", (e) => {
    const card = e.target.closest(".choice-card");
    if (card?.dataset?.choice && !locked && currentPair?.a && currentPair?.b) {
        recordVote(card.dataset.choice);
    }
});

// Check for existing login on page load
const savedUser = localStorage.getItem("ranker_user");
if (savedUser) {
    login(savedUser);
}
</script>
