<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ATL UTD KIT RANKER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

        :root {
--ink:    #FFFFFF;        /* White text on dark */
--ink2:   #e0e0e0;
--ink3:   #b0b0b0;
--paper:  #0a0a0a;        /* Near-black background */
--card:   #111111;        /* Dark card */
--border: #9E2A2F;        /* Red border accent */
--accent: #9E2A2F;        /* Atlanta United Red */
--accent2:#FEBE10;        /* Atlanta United Gold */
--gold:   #FEBE10;
--radius: 20px;
--shadow: 0 2px 0 #9E2A2F;
        }

        body {
            font-family: 'Oswald', sans-serif;
            background: var(--paper);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 60px;
            color: var(--ink);
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 36px;
            animation: fadeUp 0.5s ease both;
        }
        .eyebrow {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
        }
        h1 {
            font-family: 'Oswald', serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: -0.5px;
            color: var(--ink);
        }
        h1 em { font-style: italic; color: var(--accent); }
        .sub {
            font-size: 0.95rem;
            color: var(--ink2);
            margin-top: 10px;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--ink2);
            font-size: 0.8rem;
            padding: 5px 14px;
            border-radius: 60px;
            margin-top: 14px;
        }
        .pill-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }
        .pill-dot.offline { background: var(--gold); }
        .pill-dot.ok      { background: #5cad6b; }

        /* ── Main panel ── */
        .panel {
            width: 100%;
            max-width: 780px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 32px 24px 28px;
            margin-bottom: 16px;
            animation: fadeUp 0.5s 0.08s ease both;
        }

        /* ── VS layout ── */
        .vs-row {
            display: flex;
            align-items: stretch;
            gap: 0;
        }
        .choice-card {
            flex: 1;
            background: var(--paper);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 18px 24px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            position: relative;
            box-shadow: var(--shadow);
        }
        .choice-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 8px 24px rgba(200,73,10,0.12);
        }
        .choice-card:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 1px 0 #d9d2c8;
        }
        .choice-card.voted-winner {
            border-color: #5cad6b;
            background: #f2faf3;
            animation: winPulse 0.4s ease;
        }
        .choice-card.voted-loser {
            opacity: 0.45;
            transform: scale(0.97);
        }
        @keyframes winPulse {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        .card-img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 14px;
            background: var(--border);
            display: block;
        }
        .card-rank-hint {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink3);
            margin-bottom: 10px;
        }
        .card-name {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(1.2rem, 3vw, 1.7rem);
            font-weight: 400;
            line-height: 1.25;
            word-break: break-word;
            color: var(--ink);
            margin: 4px 0 10px;
        }
        .card-elo {
            font-size: 0.72rem;
            color: var(--ink3);
            font-family: 'DM Sans', monospace;
        }

        /* VS divider */
        .vs-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .vs-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--ink);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* ── Action bar ── */
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .btn {
            border: 1.5px solid var(--border);
            background: var(--card);
            color: var(--ink);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            padding: 9px 22px;
            border-radius: 60px;
            cursor: pointer;
            transition: background 0.12s, border-color 0.12s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover  { background: var(--accent2); border-color: var(--accent); }
        .btn:active { transform: scale(0.97); }
        .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
        .btn.primary:hover { background: var(--accent); border-color: var(--accent); }

        /* ── Results panel ── */
        #resultsPanel { display: none; }
        .results-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.4rem;
            font-weight: 400;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .rank-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .rank-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--paper);
            transition: background 0.15s;
        }
        .rank-item:first-child { background: #fffbf0; border-color: var(--gold); }
        .rank-num {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--ink3);
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }
        .rank-item:first-child .rank-num { color: var(--gold); }
        .rank-name {
            font-size: 1rem;
            font-weight: 500;
            flex: 1;
        }
        .rank-bar-wrap {
            width: 80px;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .rank-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 0.6s ease;
        }
        .rank-item:first-child .rank-bar { background: var(--gold); }
        .rank-elo {
            font-family: 'DM Sans', monospace;
            font-size: 0.75rem;
            color: var(--ink3);
            width: 46px;
            text-align: right;
            flex-shrink: 0;
        }

        /* ── Loading / error ── */
        .loading-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--ink2);
        }
        .spinner {
            width: 28px; height: 28px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Footer ── */
        footer {
            font-size: 0.72rem;
            color: var(--ink3);
            text-align: center;
            margin-top: 10px;
            animation: fadeUp 0.5s 0.2s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 560px) {
            .vs-row { flex-direction: column; }
            .vs-divider { width: auto; height: 32px; }
            .panel { padding: 20px 14px 20px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="eyebrow">Group Decision Tool</div>
    <h1>Priority <em>Ranker</em></h1>
    <div class="sub">Pick the option that matters more to your group</div>
    <div class="pill" id="statusPill">
        <span class="pill-dot" id="statusDot"></span>
        <span id="statusText">Loading…</span>
    </div>
</div>

<!-- Voting panel -->
<div class="panel" id="votingPanel">
    <div class="vs-row" id="vsContainer">
        <div class="loading-state">
            <div class="spinner"></div>
            Fetching items from your sheet…
        </div>
    </div>
    <div class="action-bar">
        <button class="btn primary" id="resultsBtn">View ranking</button>
    </div>
</div>

<!-- Results panel -->
<div class="panel" id="resultsPanel">
    <div class="results-title">
        &#x1F3C6; Current ranking
    </div>
    <ul class="rank-list" id="rankList"></ul>
    <div class="action-bar">
        <button class="btn" id="backBtn">&#8592; Back to voting</button>
    </div>
</div>

<footer>Every vote updates the Elo score — more votes means a more stable ranking.</footer>

<script>
// ─────────────────────────────────────────────
//  CONFIG — paste your Apps Script URL here
// ─────────────────────────────────────────────
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypt-e4Gpn8qM7sfhtGLUJBYRRmFblKhqZ9rqQAzbQmp9dtcLW4e5nUvGttmd-hrR27/exec";
// ─────────────────────────────────────────────
//  Elo settings
// ─────────────────────────────────────────────
const K_FACTOR     = 32;
const DEFAULT_ELO  = 1500;

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let allItems   = [];   // [{ id: string, name: string, elo: number }]
let currentPair = { a: null, b: null };
let totalVotes  = 0;
let locked      = false;  // prevent double-vote during animation

// Session ID (for server-side dedup)
let sessionId = localStorage.getItem("ranker_session");
if (!sessionId) {
    sessionId = "sess_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("ranker_session", sessionId);
}

// ─────────────────────────────────────────────
//  XSS-safe HTML escape (covers attribute context too)
// ─────────────────────────────────────────────
function esc(str) {
    return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;',
        '"': '&quot;', "'": '&#39;'
    })[c]);
}

// ─────────────────────────────────────────────
//  Status pill
// ─────────────────────────────────────────────
function setStatus(text, state) {   // state: '' | 'ok' | 'offline'
    document.getElementById("statusText").textContent = text;
    const dot = document.getElementById("statusDot");
    dot.className = "pill-dot" + (state ? " " + state : "");
}

// ─────────────────────────────────────────────
//  Persist / load Elo from localStorage
// ─────────────────────────────────────────────
function persistElos() {
    const obj = {};
    allItems.forEach(it => { obj[String(it.id)] = it.elo; });
    localStorage.setItem("item_elos", JSON.stringify(obj));
}

function loadStoredElos() {
    try { return JSON.parse(localStorage.getItem("item_elos") || "{}"); }
    catch { return {}; }
}

// ─────────────────────────────────────────────
//  JSONP helper — bypasses CORS on Apps Script
// ─────────────────────────────────────────────
function jsonp(url) {
    return new Promise((resolve, reject) => {
        const cbName = "_cb_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
        const script = document.createElement("script");
        const timer  = setTimeout(() => {
            cleanup();
            reject(new Error("Request timed out"));
        }, 10000);

        window[cbName] = data => { cleanup(); resolve(data); };

        function cleanup() {
            clearTimeout(timer);
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
        }

        script.onerror = () => { cleanup(); reject(new Error("Script load failed")); };
        script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cbName;
        document.head.appendChild(script);
    });
}

// ─────────────────────────────────────────────
//  Fetch items from Google Sheets
// ─────────────────────────────────────────────
async function fetchItems() {
    try {
        const items = await jsonp(`${SCRIPT_URL}?action=getItems`);

        if (items.error) throw new Error(items.error);
        if (!Array.isArray(items) || items.length < 2)
            throw new Error("Need at least 2 items in the Items sheet.");

        const stored = loadStoredElos();
        allItems = items.map(it => ({
            id:       String(it.id),
            name:     String(it.name),
            imageURL: String(it.imageURL || ""),
            elo:      stored[String(it.id)] ?? DEFAULT_ELO
        }));

        return true;
    } catch (err) {
        console.error(err);
        document.getElementById("vsContainer").innerHTML = `
            <div class="loading-state">
                <div style="font-size:1.6rem; margin-bottom:12px;">&#9888;&#65039;</div>
                <strong>${esc(err.message)}</strong>
                <div style="margin-top:12px; font-size:0.85rem; line-height:1.7; color:#9a9087;">
                    1. Deploy Apps Script as a Web App<br>
                    2. Execute as <em>Me</em>, access <em>Anyone</em><br>
                    3. Paste the correct URL into SCRIPT_URL<br>
                    4. Make sure your doGet() wraps the response in the callback parameter
                </div>
            </div>`;
        setStatus("Connection error", "");
        return false;
    }
}

// ─────────────────────────────────────────────
//  Pick a random pair (safe for length === 2)
// ─────────────────────────────────────────────
function getRandomPair() {
    if (allItems.length < 2) return null;
    const idxA = Math.floor(Math.random() * allItems.length);
    let   idxB = Math.floor(Math.random() * (allItems.length - 1));
    if (idxB >= idxA) idxB++;         // guaranteed different, no infinite loop
    return { a: allItems[idxA], b: allItems[idxB] };
}

// ─────────────────────────────────────────────
//  Render the current pair
// ─────────────────────────────────────────────
function renderMatchup() {
    const c = document.getElementById("vsContainer");
    if (!currentPair?.a || !currentPair?.b) {
        c.innerHTML = "<div class='loading-state'>Preparing matchup…</div>";
        return;
    }
    const { a, b } = currentPair;
    const imgA = a.imageURL ? `<img class="card-img" src="${esc(a.imageURL)}" alt="${esc(a.name)}" draggable="false">` : "";
    const imgB = b.imageURL ? `<img class="card-img" src="${esc(b.imageURL)}" alt="${esc(b.name)}" draggable="false">` : "";
    c.innerHTML = `
        <div class="choice-card" data-choice="${esc(a.id)}">
            ${imgA}
            <div class="card-rank-hint">Option A</div>
            <div class="card-name">${esc(a.name)}</div>
            <div class="card-elo">Elo ${Math.round(a.elo)}</div>
        </div>
        <div class="vs-divider"><div class="vs-circle">VS</div></div>
        <div class="choice-card" data-choice="${esc(b.id)}">
            ${imgB}
            <div class="card-rank-hint">Option B</div>
            <div class="card-name">${esc(b.name)}</div>
            <div class="card-elo">Elo ${Math.round(b.elo)}</div>
        </div>`;
}

// ─────────────────────────────────────────────
//  Update ranking list
// ─────────────────────────────────────────────
function updateRankingDisplay() {
    const sorted   = [...allItems].sort((a, b) => b.elo - a.elo);
    const maxElo   = sorted[0]?.elo ?? DEFAULT_ELO;
    const minElo   = sorted[sorted.length - 1]?.elo ?? DEFAULT_ELO;
    const eloRange = maxElo - minElo || 1;

    const list = document.getElementById("rankList");
    list.innerHTML = sorted.map((item, i) => {
        const pct = Math.round(((item.elo - minElo) / eloRange) * 100);
        const thumb = item.imageURL ? `<img src="${esc(item.imageURL)}" alt="" style="width:36px;height:36px;object-fit:cover;border-radius:8px;flex-shrink:0;">` : "";
        return `
            <li class="rank-item">
                <span class="rank-num">${i + 1}</span>
                ${thumb}
                <span class="rank-name">${esc(item.name)}</span>
                <div class="rank-bar-wrap">
                    <div class="rank-bar" style="width:${pct}%"></div>
                </div>
                <span class="rank-elo">${Math.round(item.elo)}</span>
            </li>`;
    }).join("");
}

// ─────────────────────────────────────────────
//  Record a vote
// ─────────────────────────────────────────────
async function recordVote(winnerId) {
    if (locked) return;
    locked = true;

    const winner = allItems.find(i => i.id === winnerId);
    const loser  = currentPair.a.id === winnerId ? currentPair.b : currentPair.a;
    if (!winner || !loser) { locked = false; return; }

    // ── Optimistic Elo update (local) ──
    const expWin  = 1 / (1 + Math.pow(10, (loser.elo  - winner.elo) / 400));
    const expLose = 1 / (1 + Math.pow(10, (winner.elo - loser.elo)  / 400));
    winner.elo += K_FACTOR * (1 - expWin);
    loser.elo  += K_FACTOR * (0 - expLose);
    persistElos();
    totalVotes++;

    // ── Animate cards before switching ──
    const cards = document.querySelectorAll(".choice-card");
    cards.forEach(card => {
        if (card.dataset.choice === winnerId) card.classList.add("voted-winner");
        else                                  card.classList.add("voted-loser");
    });

    // ── Fire-and-forget to Google Sheets ──
    const params = new URLSearchParams({
        action:    "saveVote",
        winnerId:  winner.id,
        loserId:   loser.id,
        sessionId
    });

    jsonp(`${SCRIPT_URL}?${params}`)
        .then(res => {
            if (res.status === "success") {
                setStatus(`${totalVotes} vote${totalVotes !== 1 ? "s" : ""} recorded`, "ok");
            } else {
                console.warn("Sheet error:", res.error);
                setStatus("Saved locally only", "offline");
            }
        })
        .catch(() => setStatus("Offline — saved locally", "offline"));

    // ── Next matchup after short animation delay ──
    setTimeout(() => {
        currentPair = getRandomPair();
        renderMatchup();
        updateRankingDisplay();
        locked = false;
    }, 320);
}

// ─────────────────────────────────────────────
//  Show / hide results
// ─────────────────────────────────────────────
function showResults() {
    updateRankingDisplay();
    document.getElementById("votingPanel").style.display  = "none";
    document.getElementById("resultsPanel").style.display = "block";
}

function hideResults() {
    document.getElementById("votingPanel").style.display  = "block";
    document.getElementById("resultsPanel").style.display = "none";
    currentPair = getRandomPair();
    renderMatchup();
}

// ─────────────────────────────────────────────
//  Init
// ─────────────────────────────────────────────
async function init() {
    setStatus("Loading…", "");
    const ok = await fetchItems();
    if (!ok) return;

    currentPair = getRandomPair();
    renderMatchup();
    updateRankingDisplay();
    setStatus("Ready — pick your priority", "ok");

    // Single delegated listener on the container
    document.getElementById("vsContainer").addEventListener("click", e => {
        const card = e.target.closest(".choice-card");
        if (card?.dataset?.choice) recordVote(card.dataset.choice);
    });

    document.getElementById("resultsBtn").addEventListener("click", showResults);
    document.getElementById("backBtn").addEventListener("click", hideResults);
}

init();
</script>
</body>
</html>
